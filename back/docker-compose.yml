version: '3.8'

services:
  cryptosafe-postgres:
    image: postgres:16-alpine
    container_name: cryptosafe-postgres
    restart: always
    environment:
      POSTGRES_DB: cryptosafe_db
      POSTGRES_USER: cryptosafe_user
      POSTGRES_PASSWORD: cryptosafe_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  cryptosafe-mysql:
    image: mysql:8.0
    container_name: cryptosafe-mysql
    restart: always
    environment:
      MYSQL_DATABASE: cryptosafe_db
      MYSQL_USER: cryptosafe_user
      MYSQL_PASSWORD: cryptosafe_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  postgres_data:
  mysql_data: